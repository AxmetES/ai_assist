<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-ассистент команды</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <h1>AI-ассистент команды</h1>
    <span id="api-key-status" class="badge badge-unknown">проверка ключа…</span>
  </header>

  <section class="card ask-card">
    <textarea id="question" placeholder="Задайте вопрос AI..." rows="3"></textarea>
    <div class="ask-row">
      <button id="ask-btn">Спросить AI</button>
      <div id="loader" class="loader" hidden></div>
      <span id="token-counter" class="token-counter"></span>
    </div>
    <p id="error" class="error" hidden></p>
  </section>

  <section id="answer-card" class="card answer-card" hidden>
    <div class="answer-card-header">
      <span>Ответ</span>
      <button id="copy-btn" class="secondary-btn">Копировать ответ</button>
    </div>
    <div id="answer-content" class="answer-content"></div>
  </section>

  <section class="history-section">
    <h2>Последние вопросы</h2>
    <div id="history-list" class="history-list"></div>
  </section>
</div>
<script src="/app.js"></script>
</body>
</html>
